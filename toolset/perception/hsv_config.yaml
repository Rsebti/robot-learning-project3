# HSV ranges (OpenCV: H 0-179, S/V 0-255).
# Yellow: bright top face only (see color_mask.mask_bright_top).

red:
  - [[0, 100, 80], [10, 255, 255]]
  - [[170, 100, 80], [180, 255, 255]]

orange:
  - [[4, 120, 80], [22, 255, 255]]

yellow:
  - [[12, 70, 110], [38, 255, 255]]

green:
  - [[40, 80, 60], [85, 255, 255]]

blue:
  - [[100, 120, 60], [130, 255, 255]]

violet:
  - [[130, 80, 60], [170, 255, 255]]

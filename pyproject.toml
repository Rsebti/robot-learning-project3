[project]
name = "robot-learning-project3"
version = "0.1.0"
description = "ETH Robot Learning Project 3 - Eval 2/3 Isaac Lab tasks for SO-101"
readme = "README.md"
requires-python = "==3.11.*"
authors = [
    { name = "Rsebti" }
]
# Runtime dependencies are provided by the isaac_so_arm101 venv
# (Isaac Sim, Isaac Lab, torch, gymnasium, rsl_rl, ...).
# We only declare ourselves as a package so we can be installed editable.
dependencies = []

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sim*"]
